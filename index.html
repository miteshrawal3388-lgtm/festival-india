<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Festival India | Deals</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#f4f6f9;
text-align:center;
}

header{
background:#ff6b00;
padding:25px;
color:white;
}

.logo{
width:80px;
margin-bottom:10px;
}

.container{
padding:20px;
}

.product{
background:white;
max-width:420px;
margin:20px auto;
padding:15px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.product img{
width:100%;
border-radius:10px;
}

.price{
font-size:20px;
color:green;
font-weight:bold;
}

.old{
text-decoration:line-through;
color:red;
margin-left:8px;
}

.buy-btn{
display:block;
margin-top:12px;
padding:12px;
background:#ff9900;
color:white;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

footer{
margin:30px 0;
font-size:13px;
color:#666;
}
</style>
</head>

<body>

<header>
<img src="logo.png" class="logo">
<h2>Festival India</h2>
<p>Best Deals Updated Automatically</p>
</header>

<div class="container" id="products"></div>

<footer>
© 2026 Festival India | Affiliate Disclosure Enabled
</footer>

<script>

// 🔴 PASTE YOUR GOOGLE SHEET CSV LINK HERE
const sheetURL = "PASTE_YOUR_CSV_LINK_HERE";

fetch(sheetURL)
.then(response => response.text())
.then(data => {
const rows = data.split("\n").slice(1);
let output = "";

rows.forEach(row => {
const cols = row.split(",");
const name = cols[0];
const price = cols[1];
const oldprice = cols[2];
const image = cols[3];
const link = cols[4];
const status = cols[6];

if(status && status.trim() === "Ready"){

output += `
<div class="product">
<img src="${image}" alt="${name}">
<h3>${name}</h3>
<div class="price">₹${price} <span class="old">₹${oldprice}</span></div>
<a href="${link}" target="_blank" class="buy-btn">Buy Now</a>
</div>
`;

}
});

document.getElementById("products").innerHTML = output;

});

</script>

</body>
</html>
